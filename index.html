<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gois.v1 | Chat & Command Center</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --border: #30363d;
            --fg: #e6edf3;
            --user: #58a6ff;
            --bot: #3fb950;
            --muted: #8b949e;
        }
        body {
            background-color: var(--bg);
            color: var(--fg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        header span { color: var(--bot); }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 120px; /* Espaço para a barra não tapar o texto */
            scroll-behavior: smooth;
        }
        .message {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user { background-color: rgba(88, 166, 255, 0.1); border-left: 4px solid var(--user); }
        .message.bot { background-color: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--bot); }
        .sender { font-weight: bold; margin-bottom: 4px; font-size: 0.9rem; }
        .user .sender { color: var(--user); }
        .bot .sender { color: var(--bot); }
        #input-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--panel);
            border-top: 1px solid var(--border);
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }
        #input-wrapper {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            background-color: var(--bg);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            font-family: inherit;
            resize: none;
            height: 45px;
            outline: none;
        }
        textarea:focus { border-color: var(--user); }
        button {
            background-color: var(--bot);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <header>
        <span>●</span> gois.v1 | Web Interface
    </header>

    <div id="chat-container">
        <div class="message bot">
            <div class="sender">gois.v1</div>
            <div class="content">Olá! Estou ligado à tua API autónoma no Render. Escreve uma mensagem em baixo para começarmos.</div>
        </div>
    </div>

    <div id="input-panel">
        <div id="input-wrapper">
            <textarea id="user-input" placeholder="Pergunta ao goisAI..." rows="1"></textarea>
            <button id="send-btn" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        const API_URL = "https://gois-v1.onrender.com"; // Aponta para a tua API no Render

        async function sendMessage() {
            const textarea = document.getElementById('user-input');
            const container = document.getElementById('chat-container');
            const text = textarea.value.trim();
            if (!text) return;

            textarea.value = '';

            // Adiciona mensagem do utilizador
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `<div class="sender">Tu</div><div class="content"></div>`;
            userMsg.querySelector('.content').textContent = text;
            container.appendChild(userMsg);
            scrollToBottom();

            // Cria balão do bot
            const botMsg = document.createElement('div');
            botMsg.className = 'message bot';
            botMsg.innerHTML = `<div class="sender">gois.v1</div><div class="content">...</div>`;
            container.appendChild(botMsg);
            scrollToBottom();

            const contentDiv = botMsg.querySelector('.content');

            try {
                const response = await fetch(`${API_URL}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: "user", content: text }],
                        stream: true
                    })
                });

                if (!response.ok) throw new Error("Erro na resposta da API");

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data:')) {
                            const dataStr = line.slice(5).trim();
                            if (dataStr === '[DONE]') break;
                            try {
                                const parsed = JSON.parse(dataStr);
                                const delta = parsed.choices?.[0]?.delta?.content;
                                if (delta) {
                                    fullText += delta;
                                    contentDiv.textContent = fullText;
                                    scrollToBottom();
                                }
                            } catch (e) {}
                        }
                    }
                }
            } catch (err) {
                contentDiv.textContent = "Erro de ligação ao backend: " + err.message;
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
