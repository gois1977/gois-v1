<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gois.v1 | Chat</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#21262d;--border:#30363d;--fg:#e6edf3;--muted:#8b949e;--accent:#238636;--accent2:#2ea043;--user:#1f6feb;--danger:#da3633;--code:#010409}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--fg);font-family:'Segoe UI',-apple-system,sans-serif;overflow:hidden}
#sidebar{width:270px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:20}
.side-head{padding:14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 12px;font-weight:600}
.btn:hover{background:var(--accent2)}
.btn.alt{background:var(--panel2);border:1px solid var(--border);font-weight:500}
#history{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px}
.h-item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:.88rem}
.h-item:hover,.h-item.active{background:var(--panel2)}
.h-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-del{background:none;border:0;color:var(--muted);padding:2px 6px}
.h-del:hover{color:var(--danger)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{padding:11px 16px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:600}
body.admin .top{border-bottom:2px solid var(--accent)}
#menu{display:none;background:none;border:0;color:var(--fg);font-size:1.2rem}
#brand{user-select:none;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px 16px 170px;display:flex;flex-direction:column;gap:16px}
.wrap{max-width:900px;width:100%;margin:0 auto}
.who{font-size:.75rem;color:var(--muted);font-weight:600;margin-bottom:3px}
.msg{padding:12px 16px;border-radius:12px;line-height:1.55;font-size:.92rem;word-wrap:break-word}
.msg.user{background:var(--user);color:#fff;white-space:pre-wrap;margin-left:auto;max-width:85%;border-bottom-right-radius:4px}
.msg.bot{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}
.txt{white-space:pre-wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:rgba(255,255,255,.15);border-radius:4px;padding:2px 8px;font-size:.75rem}
.code{background:var(--code);border:1px solid var(--border);border-radius:8px;margin:10px 0;overflow:hidden}
.code-h{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);padding:6px 10px;font-size:.75rem;color:var(--muted)}
.code-h .acts{display:flex;gap:6px}
.sm{background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:3px 10px;font-size:.75rem;font-weight:600}
.sm:hover{background:var(--accent);color:#fff}
pre{margin:0;padding:12px;overflow-x:auto;font-family:Consolas,Monaco,monospace;font-size:.85rem;color:#79c0ff}
.msg-acts{display:flex;gap:6px;margin-top:8px}
#dock{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;justify-content:center}
#box{max-width:900px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
#box.drag{border-color:var(--accent);box-shadow:0 0 0 2px rgba(46,160,67,.35)}
#files{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--user);color:#fff;border-radius:4px;padding:2px 8px;font-size:.75rem;display:inline-flex;gap:6px;align-items:center}
.pill b{cursor:pointer}
.row{display:flex;align-items:flex-end;gap:8px}
textarea{flex:1;background:transparent;color:var(--fg);border:0;resize:none;outline:0;font:inherit;font-size:.95rem;height:24px;max-height:140px}
.icon{background:var(--panel2);border:1px solid var(--border);color:var(--fg);border-radius:8px;width:34px;height:34px;font-size:1rem}
.send{background:var(--accent);color:#fff;border:0;border-radius:8px;width:34px;height:34px;font-size:1rem}
.hint{font-size:.7rem;color:var(--muted)}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
@media(max-width:768px){
 #sidebar{position:fixed;left:-280px;top:0;bottom:0;transition:left .25s}
 #sidebar.open{left:0;box-shadow:10px 0 30px rgba(0,0,0,.5)}
 #ov.on{display:block}
 #menu{display:block}
}
</style>
</head>
<body>
<div id="ov" onclick="toggleSide()"></div>
<aside id="sidebar">
  <div class="side-head">
    <button class="btn" onclick="newChat()">+ Nova conversa</button>
    <button class="btn alt" onclick="exportChat()">⬇ Exportar conversa (.md)</button>
  </div>
  <div id="history"></div>
</aside>
<div id="main">
  <div class="top">
    <button id="menu" onclick="toggleSide()">☰</button>
    <span id="brand" onclick="brandClick()">🟢 gois.v1</span>
    <span id="title" style="margin-left:auto;color:var(--muted);font-size:.8rem;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%"></span>
  </div>
  <div id="chat"></div>
  <div id="dock">
    <div id="box">
      <div id="files"></div>
      <div class="row">
        <button class="icon" title="Anexar ficheiros" onclick="document.getElementById('pick').click()">📎</button>
        <input id="pick" type="file" multiple hidden onchange="addFiles(this.files);this.value=''">
        <textarea id="input" rows="1" placeholder="Escreve uma mensagem… (arrasta ficheiros para aqui)" oninput="grow(this)"></textarea>
        <button class="send" id="sendBtn" onclick="send()">➤</button>
      </div>
      <div class="hint">Enter envia · Shift+Enter nova linha · arrasta ficheiros de texto/código para a caixa</div>
    </div>
  </div>
</div>

<script>
// Mesma origem no Render/localhost; noutros sítios (ex.: GitHub Pages) aponta ao servidor.
const API = (location.hostname.endsWith('onrender.com') || ['localhost','127.0.0.1'].includes(location.hostname)) ? '' : 'https://gois-v1.onrender.com';
const EXT = {python:'py',py:'py',javascript:'js',js:'js',typescript:'ts',ts:'ts',tsx:'tsx',jsx:'jsx',html:'html',css:'css',json:'json',bash:'sh',sh:'sh',shell:'sh',powershell:'ps1',ps1:'ps1',bat:'bat',cmd:'bat',c:'c',cpp:'cpp','c++':'cpp',csharp:'cs',cs:'cs','c#':'cs',java:'java',go:'go',rust:'rs',rs:'rs',sql:'sql',yaml:'yml',yml:'yml',xml:'xml',markdown:'md',md:'md',iss:'iss',toml:'toml',ini:'ini',txt:'txt'};
const MAX_FILE = 200000;

let adminToken = localStorage.getItem('gois_admin_token') || '';
let isAdmin = false;
const KEY = () => isAdmin ? 'gois_admin_chats' : 'gois_public_chats';
let chats = [], cur = null, files = [], busy = false, clicks = 0, clickT = null;

const $ = id => document.getElementById(id);
const hdrs = () => Object.assign({'Content-Type':'application/json'}, adminToken ? {'X-Admin-Token': adminToken} : {});

function load(){ try{ chats = JSON.parse(localStorage.getItem(KEY())||'[]'); }catch(e){ chats = []; } cur = localStorage.getItem(KEY()+'_cur'); }
function save(){ try{ localStorage.setItem(KEY(), JSON.stringify(chats)); localStorage.setItem(KEY()+'_cur', cur); }catch(e){ console.warn('localStorage cheio', e); } }
const chat = () => chats.find(c => c.id === cur);

async function initAdmin(){
  if(adminToken){
    try{
      const r = await fetch(API+'/api/admin/verify', {method:'POST', headers:hdrs()});
      isAdmin = r.ok;
      if(!r.ok && r.status === 401){ adminToken=''; localStorage.removeItem('gois_admin_token'); }
    }catch(e){ isAdmin = false; }
  }
  document.body.classList.toggle('admin', isAdmin);
  $('brand').textContent = isAdmin ? '🟢 gois.v1 | Admin' : '🟢 gois.v1';
}
async function brandClick(){
  clicks++; clearTimeout(clickT); clickT = setTimeout(()=>clicks=0, 1500);
  if(clicks < 5) return; clicks = 0;
  if(isAdmin){
    if(confirm('Sair do modo admin?')){ adminToken=''; localStorage.removeItem('gois_admin_token'); location.reload(); }
    return;
  }
  const p = prompt('Token de administrador:');
  if(!p) return;
  adminToken = p.trim();
  const r = await fetch(API+'/api/admin/verify', {method:'POST', headers:hdrs()}).catch(()=>null);
  if(r && r.ok){ localStorage.setItem('gois_admin_token', adminToken); location.reload(); }
  else { adminToken=''; alert(r && r.status===503 ? 'ADMIN_TOKEN não está definido no servidor.' : 'Token incorreto.'); }
}

function toggleSide(){ $('sidebar').classList.toggle('open'); $('ov').classList.toggle('on'); }
function grow(t){ t.style.height='24px'; t.style.height=t.scrollHeight+'px'; }

function newChat(){
  const c = {id:'chat_'+Date.now(), title:'Nova conversa', messages:[]};
  chats.unshift(c); cur = c.id; save(); renderHistory(); renderChat(); closeSide();
}
function closeSide(){ $('sidebar').classList.remove('open'); $('ov').classList.remove('on'); }
function delChat(id, e){
  e.stopPropagation();
  if(!confirm('Apagar esta conversa?')) return;
  chats = chats.filter(c => c.id !== id);
  if(!chats.length) return newChat();
  if(cur === id) cur = chats[0].id;
  save(); renderHistory(); renderChat();
}
function switchChat(id){ cur = id; save(); renderHistory(); renderChat(); closeSide(); }
function renderHistory(){
  const el = $('history'); el.innerHTML = '';
  chats.forEach(c => {
    const d = document.createElement('div'); d.className = 'h-item' + (c.id === cur ? ' active' : '');
    d.onclick = () => switchChat(c.id);
    const t = document.createElement('div'); t.className = 'h-title'; t.textContent = c.title;   // textContent: sem XSS
    const x = document.createElement('button'); x.className = 'h-del'; x.textContent = '✕'; x.onclick = e => delChat(c.id, e);
    d.append(t, x); el.appendChild(d);
  });
}

function fenceParts(text){
  const parts = []; const re = /```([^\n`]*)\n([\s\S]*?)```/g; let last = 0, m;
  while((m = re.exec(text))){
    if(m.index > last) parts.push({t:'text', v:text.slice(last, m.index)});
    const info = m[1].trim().split(/\s+/).filter(Boolean);
    let lang = (info[0]||'').toLowerCase(), name = info.slice(1).find(x => x.includes('.')) || '';
    if(lang.includes('.')){ name = lang; lang = name.split('.').pop(); }
    parts.push({t:'code', lang, name, v:m[2].replace(/\n$/, '')});
    last = re.lastIndex;
  }
  if(last < text.length) parts.push({t:'text', v:text.slice(last)});
  return parts;
}
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  if(btn){ const o = btn.textContent; btn.textContent = '✅ Copiado!'; setTimeout(()=>btn.textContent = o, 1600); }
}
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'text/plain;charset=utf-8'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function mk(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }

function renderBot(text){
  const box = mk('div'); let n = 0;
  fenceParts(text).forEach(p => {
    if(p.t === 'text'){ if(p.v.trim()) box.appendChild(mk('div','txt',p.v.replace(/^\n+|\n+$/g,''))); return; }
    n++;
    const ext = p.name ? '' : (EXT[p.lang] || 'txt'), fname = p.name || `codigo_${n}.${ext}`;
    const wrap = mk('div','code'), head = mk('div','code-h'), acts = mk('div','acts');
    head.appendChild(mk('span','',(p.name || p.lang || 'código').toUpperCase()));
    const cp = mk('button','sm','📋 Copiar'); cp.onclick = () => copyText(p.v, cp);
    const dl = mk('button','sm','💾 Download'); dl.onclick = () => download(fname, p.v);
    acts.append(cp, dl); head.appendChild(acts);
    const pre = mk('pre'); pre.appendChild(mk('code','',p.v));
    wrap.append(head, pre); box.appendChild(wrap);
  });
  return box;
}
function addMsg(role, m, streaming){
  const w = mk('div','wrap'); w.appendChild(mk('div','who', role === 'user' ? 'Tu' : 'gois.v1'));
  const el = mk('div','msg ' + (role === 'user' ? 'user' : 'bot'));
  if(role === 'user'){
    el.appendChild(mk('div','', m.display || m.content));
    if(m.files && m.files.length){ const c = mk('div','chips'); m.files.forEach(f => c.appendChild(mk('span','chip','📎 '+f))); el.appendChild(c); }
  } else {
    el.appendChild(renderBot(m.content));
    if(!streaming && m.content){
      const a = mk('div','msg-acts');
      const c = mk('button','sm','📋 Copiar resposta'); c.onclick = () => copyText(m.content, c);
      const d = mk('button','sm','💾 Guardar (.md)'); d.onclick = () => download('resposta.md', m.content);
      a.append(c, d); el.appendChild(a);
    }
  }
  w.appendChild(el); $('chat').appendChild(w); scrollEnd(); return el;
}
function renderChat(){
  const c = chat(); $('chat').innerHTML = ''; if(!c) return;
  $('title').textContent = c.title;
  if(!c.messages.length) addMsg('bot', {content: isAdmin ? 'Olá Chefe! Modo admin ativo.' : 'Olá! Como posso ajudar hoje?'}, true);
  c.messages.forEach(m => addMsg(m.role === 'user' ? 'user' : 'bot', m));
}
function scrollEnd(){ const c = $('chat'); c.scrollTop = c.scrollHeight; }

// ---------- ficheiros ----------
function renderFiles(){
  const el = $('files'); el.innerHTML = '';
  files.forEach((f, i) => {
    const p = mk('span','pill','📄 ' + f.name + ' '); const x = mk('b','','✕'); x.onclick = () => { files.splice(i,1); renderFiles(); };
    p.appendChild(x); el.appendChild(p);
  });
}
function addFiles(list){
  [...list].forEach(f => {
    const r = new FileReader();
    r.onload = () => {
      let txt = String(r.result || '');
      if(txt.includes('\u0000')){ alert(`"${f.name}" parece binário e não pode ser lido como texto.`); return; }
      if(txt.length > MAX_FILE){ txt = txt.slice(0, MAX_FILE); alert(`"${f.name}" foi cortado aos primeiros ${MAX_FILE/1000} KB.`); }
      files.push({name:f.name, content:txt}); renderFiles();
    };
    r.readAsText(f);
  });
}
const box = $('box');
['dragenter','dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); box.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); if(ev==='drop' || e.target === document.documentElement) box.classList.remove('drag'); }));
window.addEventListener('drop', e => { box.classList.remove('drag'); if(e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

// ---------- envio com streaming ----------
async function send(){
  if(busy) return;
  const ta = $('input'); const text = ta.value.trim();
  if(!text && !files.length) return;
  const c = chat();
  let content = text || '(ficheiros anexados)';
  files.forEach(f => content += `\n\n[Ficheiro anexado: ${f.name}]\n\`\`\`\n${f.content}\n\`\`\``);
  const m = {role:'user', content, display: text || '(ficheiros anexados)', files: files.map(f => f.name)};
  if(!c.messages.length){ c.title = (text || files[0].name).slice(0, 30); renderHistory(); $('title').textContent = c.title; }
  c.messages.push(m); files = []; renderFiles(); ta.value = ''; grow(ta); save();
  addMsg('user', m);
  const botEl = addMsg('bot', {content:'…'}, true);
  busy = true; $('sendBtn').disabled = true;
  let full = '';
  try{
    const ctx = c.messages.slice(-20).map(x => ({role: x.role === 'user' ? 'user' : 'assistant', content: x.content}));
    const resp = await fetch(API+'/v1/chat/completions', {method:'POST', headers:hdrs(), body:JSON.stringify({messages:ctx, stream:true})});
    if(!resp.ok){ let d = ''; try{ d = (await resp.json()).detail; }catch(e){} throw new Error(d || ('HTTP '+resp.status)); }
    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '', done = false;
    while(!done){
      const {value, done: d} = await reader.read(); if(d) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n'); buf = lines.pop();            // guarda a linha incompleta para o próximo pedaço
      for(const line of lines){
        if(!line.startsWith('data:')) continue;
        const s = line.slice(5).trim(); if(s === '[DONE]'){ done = true; break; }
        try{
          const j = JSON.parse(s);
          if(j.error) throw new Error(j.error.message);
          const dlt = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if(dlt){ full += dlt; botEl.replaceChildren(renderBot(full)); scrollEnd(); }
        }catch(e){ if(e.message && !(e instanceof SyntaxError)) throw e; }
      }
    }
    if(!full) throw new Error('Resposta vazia do servidor.');
    c.messages.push({role:'assistant', content: full}); save();
    renderChat();
  }catch(err){
    botEl.replaceChildren(mk('div','txt','❌ ' + err.message + (full ? '\n\n(resposta parcial guardada)' : '')));
    if(full){ c.messages.push({role:'assistant', content: full}); save(); }
  }
  busy = false; $('sendBtn').disabled = false; ta.focus();
}
$('input').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });

function exportChat(){
  const c = chat(); if(!c || !c.messages.length) return;
  const md = c.messages.map(m => `## ${m.role === 'user' ? 'Tu' : 'gois.v1'}\n\n${m.display || m.content}\n`).join('\n');
  download((c.title || 'conversa').replace(/[^\w\-]+/g,'_') + '.md', md);
}

(async function(){
  await initAdmin(); load();
  if(!chats.length) newChat(); else { if(!chat()) cur = chats[0].id; renderHistory(); renderChat(); }
})();
</script>
</body>
</html>
