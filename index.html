<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gois.v1 | Chat</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#21262d;--border:#30363d;--fg:#e6edf3;--muted:#8b949e;--accent:#238636;--accent2:#2ea043;--user:#1f6feb;--danger:#da3633;--code:#010409}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;background:var(--bg);color:var(--fg);font-family:'Segoe UI',-apple-system,sans-serif;overflow:hidden}
#sidebar{width:270px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:20}
.side-head{padding:14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 12px;font-weight:600}
.btn:hover{background:var(--accent2)}
.btn.alt{background:var(--panel2);border:1px solid var(--border);font-weight:500}
#history{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px}
.h-item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:.88rem}
.h-item:hover,.h-item.active{background:var(--panel2)}
.h-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-del{background:none;border:0;color:var(--muted);padding:2px 6px}
.h-del:hover{color:var(--danger)}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top{padding:11px 16px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:600}
body.admin .top{border-bottom:2px solid var(--accent)}
#menu{display:none;background:none;border:0;color:var(--fg);font-size:1.2rem}
#brand{user-select:none;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px 16px 170px;display:flex;flex-direction:column;gap:16px}
.wrap{max-width:900px;width:100%;margin:0 auto}
.who{font-size:.75rem;color:var(--muted);font-weight:600;margin-bottom:3px}
.msg{padding:12px 16px;border-radius:12px;line-height:1.55;font-size:.92rem;word-wrap:break-word}
.msg.user{background:var(--user);color:#fff;white-space:pre-wrap;margin-left:auto;max-width:85%;border-bottom-right-radius:4px}
.msg.bot{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px}
.txt{white-space:pre-wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:rgba(255,255,255,.15);border-radius:4px;padding:2px 8px;font-size:.75rem}
.code{background:var(--code);border:1px solid var(--border);border-radius:8px;margin:10px 0;overflow:hidden}
.code-h{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);padding:6px 10px;font-size:.75rem;color:var(--muted)}
.code-h .acts{display:flex;gap:6px}
.sm{background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:3px 10px;font-size:.75rem;font-weight:600}
.sm:hover{background:var(--accent);color:#fff}
pre{margin:0;padding:12px;overflow-x:auto;font-family:Consolas,Monaco,monospace;font-size:.85rem;color:#79c0ff}
.msg-acts{display:flex;gap:6px;margin-top:8px}
#dock{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;justify-content:center}
#box{max-width:900px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
#box.drag{border-color:var(--accent);box-shadow:0 0 0 2px rgba(46,160,67,.35)}
#files{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--user);color:#fff;border-radius:4px;padding:2px 8px;font-size:.75rem;display:inline-flex;gap:6px;align-items:center}
.pill b{cursor:pointer}
.row{display:flex;align-items:flex-end;gap:8px}
textarea{flex:1;background:transparent;color:var(--fg);border:0;resize:none;outline:0;font:inherit;font-size:.95rem;height:24px;max-height:140px}
.icon{background:var(--panel2);border:1px solid var(--border);color:var(--fg);border-radius:8px;width:34px;height:34px;font-size:1rem}
.send{background:var(--accent);color:#fff;border:0;border-radius:8px;width:34px;height:34px;font-size:1rem}
.hint{font-size:.7rem;color:var(--muted)}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
@media(max-width:768px){
 #sidebar{position:fixed;left:-280px;top:0;bottom:0;transition:left .25s}
 #sidebar.open{left:0;box-shadow:10px 0 30px rgba(0,0,0,.5)}
 #ov.on{display:block}
 #menu{display:block}
}
.adm-only{display:none}
body.admin .adm-only{display:block}
body.admin #admBtn{display:inline-block}
#admBtn{display:none}
#adm{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#adm.on{display:block}
.adm-h{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:2px solid var(--accent);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;font-weight:600}
.adm-w{max-width:900px;margin:0 auto;padding:14px 14px 60px;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
.sec h3{margin:0 0 8px;font-size:.9rem}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.k{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px}
.k .l{font-size:.72rem;color:var(--muted)}
.k .v{font-size:1.45rem;font-weight:700;line-height:1.3}
.k .s{font-size:.7rem;color:var(--muted)}
.bar{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:4px 0}
.bar>i{display:block;height:100%;background:var(--accent2)}
.bar.warn>i{background:#d29922}
.bar.full>i{background:var(--danger)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.82rem;min-width:420px}
table.t th{color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--border)}
table.t td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--panel2)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr.sel td{background:var(--panel2)}
table.t tbody tr{cursor:pointer}
.in{background:var(--code);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font:inherit;font-size:.9rem;width:100%}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow label{font-size:.78rem;color:var(--muted);min-width:78px}
.frow .in{flex:1;min-width:90px}
.muted{color:var(--muted);font-size:.78rem}
.ok{color:#3fb950}.bad{color:#f85149}.warnc{color:#d29922}
#admMsg{min-height:1.2em;font-size:.82rem}
.lamp{display:none;align-items:center;gap:7px;font-size:.78rem;font-weight:600;color:var(--fg);min-width:0}
body.admin .lamp{display:inline-flex}
.lamp .lt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lamp .pre{display:none}
@media(min-width:520px){.lamp .pre{display:inline}}
.dot{position:relative;width:10px;height:10px;border-radius:50%;background:var(--c,#8b949e);flex-shrink:0}
.dot.pulse::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c);animation:ring 1.5s ease-out infinite}
.dot.slow{animation:breathe 2.2s ease-in-out infinite}
.spinr{width:16px;height:16px;border-radius:50%;border:3px solid rgba(139,148,158,.28);border-top-color:var(--c);animation:rot .8s linear infinite;flex-shrink:0}
.badge{position:relative;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;background:rgba(139,148,158,.2);color:var(--muted);flex-shrink:0}
.badge.on{background:var(--user);color:#fff}
.badge.on::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--user);animation:ring 1.4s ease-out infinite}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.lrow h3{margin:0}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes rot{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.dot,.dot::after,.spinr,.badge::after{animation:none!important}}
</style>
</head>
<body>
<div id="ov" onclick="toggleSide()"></div>
<aside id="sidebar">
  <div class="side-head">
    <button class="btn" onclick="newChat()">+ Nova conversa</button>
    <button class="btn alt" onclick="exportChat()">⬇ Exportar conversa (.md)</button>
    <button class="btn alt adm-only" onclick="closeSide();openAdmin()">📊 Painel admin</button>
  </div>
  <div id="history"></div>
</aside>
<div id="main">
  <div class="top">
    <button id="menu" onclick="toggleSide()">☰</button>
    <span id="brand" onclick="brandClick()">🟢 gois.v1</span>
    <button id="admBtn" class="sm" onclick="openAdmin()">📊 Painel</button>
    <span class="lamp" id="modelLamp" title="Estado do modelo"><i class="dot"></i><span><span class="pre"></span><span class="lt"></span></span></span>
    <span id="title" style="margin-left:auto;color:var(--muted);font-size:.8rem;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40%"></span>
  </div>
  <div id="chat"></div>
  <div id="dock">
    <div id="box">
      <div id="files"></div>
      <div class="row">
        <button class="icon" title="Anexar ficheiros" onclick="document.getElementById('pick').click()">📎</button>
        <input id="pick" type="file" multiple hidden onchange="addFiles(this.files);this.value=''">
        <textarea id="input" rows="1" placeholder="Escreve uma mensagem… (arrasta ficheiros para aqui)" oninput="grow(this)"></textarea>
        <button class="send" id="sendBtn" onclick="send()">➤</button>
      </div>
      <div class="hint">Enter envia · Shift+Enter nova linha · arrasta ficheiros de texto/código para a caixa</div>
    </div>
  </div>
</div>

<div id="adm">
  <div class="adm-h">
    <span>📊 Painel admin</span>
    <button class="sm" style="margin-left:auto" onclick="admLoad()">⟳ Atualizar</button>
    <button class="sm" onclick="closeAdmin()">✕ Fechar</button>
  </div>
  <div class="adm-w" id="admBody"><div class="muted">A carregar…</div></div>
</div>

<script>
// Mesma origem no Render/localhost; noutros sítios (ex.: GitHub Pages) aponta ao servidor.
const API = (location.hostname.endsWith('onrender.com') || ['localhost','127.0.0.1'].includes(location.hostname)) ? '' : 'https://gois-v1.onrender.com';
const EXT = {python:'py',py:'py',javascript:'js',js:'js',typescript:'ts',ts:'ts',tsx:'tsx',jsx:'jsx',html:'html',css:'css',json:'json',bash:'sh',sh:'sh',shell:'sh',powershell:'ps1',ps1:'ps1',bat:'bat',cmd:'bat',c:'c',cpp:'cpp','c++':'cpp',csharp:'cs',cs:'cs','c#':'cs',java:'java',go:'go',rust:'rs',rs:'rs',sql:'sql',yaml:'yml',yml:'yml',xml:'xml',markdown:'md',md:'md',iss:'iss',toml:'toml',ini:'ini',txt:'txt'};
const MAX_FILE = 200000;

let adminToken = localStorage.getItem('gois_admin_token') || '';
let isAdmin = false;
const KEY = () => isAdmin ? 'gois_admin_chats' : 'gois_public_chats';
let chats = [], cur = null, files = [], busy = false, clicks = 0, clickT = null;

const $ = id => document.getElementById(id);
const hdrs = () => Object.assign({'Content-Type':'application/json'}, adminToken ? {'X-Admin-Token': adminToken} : {});

function load(){ try{ chats = JSON.parse(localStorage.getItem(KEY())||'[]'); }catch(e){ chats = []; } cur = localStorage.getItem(KEY()+'_cur'); }
function save(){ try{ localStorage.setItem(KEY(), JSON.stringify(chats)); localStorage.setItem(KEY()+'_cur', cur); }catch(e){ console.warn('localStorage cheio', e); } }
const chat = () => chats.find(c => c.id === cur);

async function initAdmin(){
  if(adminToken){
    try{
      const r = await fetch(API+'/api/admin/verify', {method:'POST', headers:hdrs()});
      isAdmin = r.ok;
      if(!r.ok && r.status === 401){ adminToken=''; localStorage.removeItem('gois_admin_token'); }
    }catch(e){ isAdmin = false; }
  }
  document.body.classList.toggle('admin', isAdmin);
  $('brand').textContent = isAdmin ? '🟢 gois.v1 | Admin' : '🟢 gois.v1';
}
async function brandClick(){
  clicks++; clearTimeout(clickT); clickT = setTimeout(()=>clicks=0, 1500);
  if(clicks < 5) return; clicks = 0;
  if(isAdmin){
    if(confirm('Sair do modo admin?')){ adminToken=''; localStorage.removeItem('gois_admin_token'); location.reload(); }
    return;
  }
  const p = prompt('Token de administrador:');
  if(!p) return;
  adminToken = p.trim();
  const r = await fetch(API+'/api/admin/verify', {method:'POST', headers:hdrs()}).catch(()=>null);
  if(r && r.ok){ localStorage.setItem('gois_admin_token', adminToken); location.reload(); }
  else { adminToken=''; alert(r && r.status===503 ? 'ADMIN_TOKEN não está definido no servidor.' : 'Token incorreto.'); }
}

function toggleSide(){ $('sidebar').classList.toggle('open'); $('ov').classList.toggle('on'); }
function grow(t){ t.style.height='24px'; t.style.height=t.scrollHeight+'px'; }

function newChat(){
  const c = {id:'chat_'+Date.now(), title:'Nova conversa', messages:[]};
  chats.unshift(c); cur = c.id; save(); renderHistory(); renderChat(); closeSide();
}
function closeSide(){ $('sidebar').classList.remove('open'); $('ov').classList.remove('on'); }
function delChat(id, e){
  e.stopPropagation();
  if(!confirm('Apagar esta conversa?')) return;
  chats = chats.filter(c => c.id !== id);
  if(!chats.length) return newChat();
  if(cur === id) cur = chats[0].id;
  save(); renderHistory(); renderChat();
}
function switchChat(id){ cur = id; save(); renderHistory(); renderChat(); closeSide(); }
function renderHistory(){
  const el = $('history'); el.innerHTML = '';
  chats.forEach(c => {
    const d = document.createElement('div'); d.className = 'h-item' + (c.id === cur ? ' active' : '');
    d.onclick = () => switchChat(c.id);
    const t = document.createElement('div'); t.className = 'h-title'; t.textContent = c.title;   // textContent: sem XSS
    const x = document.createElement('button'); x.className = 'h-del'; x.textContent = '✕'; x.onclick = e => delChat(c.id, e);
    d.append(t, x); el.appendChild(d);
  });
}

function fenceParts(text){
  const parts = []; const re = /```([^\n`]*)\n([\s\S]*?)```/g; let last = 0, m;
  while((m = re.exec(text))){
    if(m.index > last) parts.push({t:'text', v:text.slice(last, m.index)});
    const info = m[1].trim().split(/\s+/).filter(Boolean);
    let lang = (info[0]||'').toLowerCase(), name = info.slice(1).find(x => x.includes('.')) || '';
    if(lang.includes('.')){ name = lang; lang = name.split('.').pop(); }
    parts.push({t:'code', lang, name, v:m[2].replace(/\n$/, '')});
    last = re.lastIndex;
  }
  if(last < text.length) parts.push({t:'text', v:text.slice(last)});
  return parts;
}
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  if(btn){ const o = btn.textContent; btn.textContent = '✅ Copiado!'; setTimeout(()=>btn.textContent = o, 1600); }
}
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'text/plain;charset=utf-8'}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function mk(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }

function renderBot(text){
  const box = mk('div'); let n = 0;
  fenceParts(text).forEach(p => {
    if(p.t === 'text'){ if(p.v.trim()) box.appendChild(mk('div','txt',p.v.replace(/^\n+|\n+$/g,''))); return; }
    n++;
    const ext = p.name ? '' : (EXT[p.lang] || 'txt'), fname = p.name || `codigo_${n}.${ext}`;
    const wrap = mk('div','code'), head = mk('div','code-h'), acts = mk('div','acts');
    head.appendChild(mk('span','',(p.name || p.lang || 'código').toUpperCase()));
    const cp = mk('button','sm','📋 Copiar'); cp.onclick = () => copyText(p.v, cp);
    const dl = mk('button','sm','💾 Download'); dl.onclick = () => download(fname, p.v);
    acts.append(cp, dl); head.appendChild(acts);
    const pre = mk('pre'); pre.appendChild(mk('code','',p.v));
    wrap.append(head, pre); box.appendChild(wrap);
  });
  return box;
}
function addMsg(role, m, streaming){
  const w = mk('div','wrap'); w.appendChild(mk('div','who', role === 'user' ? 'Tu' : 'gois.v1'));
  const el = mk('div','msg ' + (role === 'user' ? 'user' : 'bot'));
  if(role === 'user'){
    el.appendChild(mk('div','', m.display || m.content));
    if(m.files && m.files.length){ const c = mk('div','chips'); m.files.forEach(f => c.appendChild(mk('span','chip','📎 '+f))); el.appendChild(c); }
  } else {
    el.appendChild(renderBot(m.content));
    if(!streaming && m.content){
      const a = mk('div','msg-acts');
      const c = mk('button','sm','📋 Copiar resposta'); c.onclick = () => copyText(m.content, c);
      const d = mk('button','sm','💾 Guardar (.md)'); d.onclick = () => download('resposta.md', m.content);
      a.append(c, d); el.appendChild(a);
    }
  }
  w.appendChild(el); $('chat').appendChild(w); scrollEnd(); return el;
}
function renderChat(){
  const c = chat(); $('chat').innerHTML = ''; if(!c) return;
  $('title').textContent = c.title;
  if(!c.messages.length) addMsg('bot', {content: isAdmin ? 'Olá Chefe! Modo admin ativo.' : 'Olá! Como posso ajudar hoje?'}, true);
  c.messages.forEach(m => addMsg(m.role === 'user' ? 'user' : 'bot', m));
}
function scrollEnd(){ const c = $('chat'); c.scrollTop = c.scrollHeight; }

// ---------- ficheiros ----------
function renderFiles(){
  const el = $('files'); el.innerHTML = '';
  files.forEach((f, i) => {
    const p = mk('span','pill','📄 ' + f.name + ' '); const x = mk('b','','✕'); x.onclick = () => { files.splice(i,1); renderFiles(); };
    p.appendChild(x); el.appendChild(p);
  });
}
function addFiles(list){
  [...list].forEach(f => {
    const r = new FileReader();
    r.onload = () => {
      let txt = String(r.result || '');
      if(txt.includes('\u0000')){ alert(`"${f.name}" parece binário e não pode ser lido como texto.`); return; }
      if(txt.length > MAX_FILE){ txt = txt.slice(0, MAX_FILE); alert(`"${f.name}" foi cortado aos primeiros ${MAX_FILE/1000} KB.`); }
      files.push({name:f.name, content:txt}); renderFiles();
    };
    r.readAsText(f);
  });
}
const box = $('box');
['dragenter','dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); box.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); if(ev==='drop' || e.target === document.documentElement) box.classList.remove('drag'); }));
window.addEventListener('drop', e => { box.classList.remove('drag'); if(e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

// ---------- envio com streaming ----------
async function send(){
  if(busy) return;
  const ta = $('input'); const text = ta.value.trim();
  if(!text && !files.length) return;
  const c = chat();
  let content = text || '(ficheiros anexados)';
  files.forEach(f => content += `\n\n[Ficheiro anexado: ${f.name}]\n\`\`\`\n${f.content}\n\`\`\``);
  const m = {role:'user', content, display: text || '(ficheiros anexados)', files: files.map(f => f.name)};
  if(!c.messages.length){ c.title = (text || files[0].name).slice(0, 30); renderHistory(); $('title').textContent = c.title; }
  c.messages.push(m); files = []; renderFiles(); ta.value = ''; grow(ta); save();
  addMsg('user', m);
  const botEl = addMsg('bot', {content:'…'}, true);
  busy = true; $('sendBtn').disabled = true;
  let full = '';
  try{
    const ctx = c.messages.slice(-20).map(x => ({role: x.role === 'user' ? 'user' : 'assistant', content: x.content}));
    const resp = await fetch(API+'/v1/chat/completions', {method:'POST', headers:hdrs(), body:JSON.stringify({messages:ctx, stream:true})});
    if(!resp.ok){ let d = ''; try{ d = (await resp.json()).detail; }catch(e){} throw new Error(d || ('HTTP '+resp.status)); }
    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = '', done = false;
    while(!done){
      const {value, done: d} = await reader.read(); if(d) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n'); buf = lines.pop();            // guarda a linha incompleta para o próximo pedaço
      for(const line of lines){
        if(!line.startsWith('data:')) continue;
        const s = line.slice(5).trim(); if(s === '[DONE]'){ done = true; break; }
        try{
          const j = JSON.parse(s);
          if(j.error) throw new Error(j.error.message);
          const dlt = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if(dlt){ full += dlt; botEl.replaceChildren(renderBot(full)); scrollEnd(); }
        }catch(e){ if(e.message && !(e instanceof SyntaxError)) throw e; }
      }
    }
    if(!full) throw new Error('Resposta vazia do servidor.');
    c.messages.push({role:'assistant', content: full}); save();
    renderChat();
  }catch(err){
    botEl.replaceChildren(mk('div','txt','❌ ' + err.message + (full ? '\n\n(resposta parcial guardada)' : '')));
    if(full){ c.messages.push({role:'assistant', content: full}); save(); }
  }
  busy = false; $('sendBtn').disabled = false; ta.focus();
}
$('input').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });

function exportChat(){
  const c = chat(); if(!c || !c.messages.length) return;
  const md = c.messages.map(m => `## ${m.role === 'user' ? 'Tu' : 'gois.v1'}\n\n${m.display || m.content}\n`).join('\n');
  download((c.title || 'conversa').replace(/[^\w\-]+/g,'_') + '.md', md);
}


// ================= Painel admin (só em modo admin) =================
const fmtN = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const fmtP = v => (v == null ? '—' : (Math.round(v * 10) / 10) + ' %');
let admData = null, admSel = null, admBusy = false, admLocal = null;

async function admApi(path, method, body){
  const r = await fetch(API + path, {method: method || 'GET', headers: hdrs(), body: body === undefined ? undefined : JSON.stringify(body)});
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j && (j.detail || (j.error && j.error.message))) || ('HTTP ' + r.status));
  return j;
}
function parseTok(raw){
  raw = String(raw || '').trim().toLowerCase().replace(/[.,\s]/g, '');
  let m = 1;
  if(raw.endsWith('k')){ m = 1e3; raw = raw.slice(0, -1); } else if(raw.endsWith('m')){ m = 1e6; raw = raw.slice(0, -1); }
  const n = parseInt(raw || '0', 10);
  if(isNaN(n) || n < 0) throw new Error('Número inválido (ex.: 300000 ou 300k).');
  return n * m;
}
function ce(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function admMsg(text, cls){ const m = $('admMsg'); if(m){ m.textContent = text || ''; m.className = cls || 'muted'; } }

function openAdmin(){ if(!isAdmin) return; $('adm').classList.add('on'); admLoad(); }
function closeAdmin(){ $('adm').classList.remove('on'); }

async function admLoad(){
  try{
    admData = await admApi('/api/settings');
  }catch(e){
    $('admBody').replaceChildren(ce('div', 'bad', '❌ ' + e.message));
    return;
  }
  admRender();
  admApi('/api/local/status').then(s => { admLocal = s; admRenderLocal(); }).catch(() => {});
}

function admTotals(cats){
  const out = {};
  for(const [k, f] of [['gois','gois_score'], ['gemini','gemini_ref'], ['deepseek','deepseek_ref']]){
    const v = Object.values(cats).map(e => e[f]).filter(x => x != null);
    out[k] = {v: v.length ? v.reduce((a, b) => a + b, 0) / v.length : null, n: v.length};
  }
  return out;
}
function kpi(label, value, sub, cls){
  const k = ce('div', 'k'); k.append(ce('div', 'l', label), ce('div', 'v ' + (cls || ''), value), ce('div', 's', sub || '')); return k;
}
function barEl(used, cap){
  const b = ce('div', 'bar'), i = document.createElement('i');
  const p = cap ? Math.min(100, used / cap * 100) : 0;
  i.style.width = p + '%'; if(p >= 100) b.classList.add('full'); else if(p >= 80) b.classList.add('warn');
  b.append(i); return b;
}

function admRender(){
  const d = admData, body = $('admBody'); body.replaceChildren();
  const comp = d.comparison || {}, cats = comp.categories || {}, names = d.categories || Object.keys(cats);
  const tot = admTotals(cats), tok = d.tokens || {}, cap = d.capacity || {};
  if(!admSel || !names.includes(admSel)) admSel = names[0];

  // estado
  const st = ce('div', 'sec');
  const sh = ce('div', 'lrow'); sh.append(ce('h3', '', '🏫 Sala de Aula'), mkLamp('studyLamp')); st.append(sh);
  const provs = (d.providers_with_key || []).join(', ') || 'NENHUM (configura chaves no Render)';
  st.append(ce('div', '', 'Fornecedores com chave: ' + provs));
  st.append(ce('div', 'muted', 'Professor atual: ' + (d.current_teacher || '—') + ' · Lições: ' + (comp.lessons_total || 0)));
  const loc = ce('div', 'muted', 'Modelo próprio: a verificar…'); loc.id = 'admLocal'; st.append(loc);
  if(d.last_error) st.append(ce('div', 'bad', '⚠ Último erro: ' + d.last_error));
  const auto = !!d.learning_now;
  const ab = ce('button', 'btn' + (auto ? '' : ' alt'), auto ? '⏸ Modo autónomo: ON' : '▶ Modo autónomo: OFF');
  ab.style.marginTop = '8px'; ab.onclick = () => admAct('learning_now', () => admApi('/api/settings', 'POST', {learning_now: !auto}), r => r);
  st.append(ab);
  body.append(st);

  // KPIs
  const g = ce('div', 'kg');
  g.append(kpi('gois.v1 · total', fmtP(tot.gois.v), tot.gois.n + '/' + names.length + ' categorias medidas'));
  g.append(kpi('Gemini · total', fmtP(tot.gemini.v), tot.gemini.n + '/' + names.length + ' categorias medidas'));
  g.append(kpi('DeepSeek · total', fmtP(tot.deepseek.v), tot.deepseek.n + '/' + names.length + ' categorias medidas'));
  g.append(kpi('Paridade vs Gemini', comp.parity_vs_gemini ? comp.parity_vs_gemini + ' %' : '—', 'gois.v1 ÷ Gemini'));
  g.append(kpi('Paridade vs DeepSeek', comp.parity_vs_deepseek ? comp.parity_vs_deepseek + ' %' : '—', 'gois.v1 ÷ DeepSeek'));
  g.append(kpi('Capacidade restante (estim.)', cap.total_capacity ? fmtN(cap.total_remaining) : '—', cap.total_capacity ? 'de ' + fmtN(cap.total_capacity) : 'define abaixo'));
  g.append(kpi('Tokens hoje', fmtN(tok.used_today), 'limite ' + (tok.daily_limit ? fmtN(tok.daily_limit) : '∞') + ' · total ' + fmtN(tok.used_total)));
  body.append(g);

  // tokens e capacidade
  const ts = ce('div', 'sec'); ts.append(ce('h3', '', '🔋 Tokens e capacidade diária (estimativa)'));
  const inputs = {};
  for(const [n, r] of Object.entries(cap.providers || {})){
    const row = ce('div'); 
    row.append(ce('div', 'muted', n + ': ' + fmtN(r.used) + ' gastos' + (r.capacity ? ' de ' + fmtN(r.capacity) : ' (capacidade desconhecida)')));
    row.append(barEl(r.used, r.capacity));
    const fr = ce('div', 'frow'); fr.append(ce('label', '', 'Capacidade'));
    const inp = ce('input', 'in'); inp.value = r.capacity || 0; inp.inputMode = 'numeric'; inputs[n] = inp; fr.append(inp);
    row.append(fr); ts.append(row);
  }
  const sc = ce('button', 'btn alt', 'Guardar capacidade'); sc.style.marginTop = '8px';
  sc.onclick = () => { try{
    const caps = {}; for(const [n, i] of Object.entries(inputs)) caps[n] = parseTok(i.value);
    admAct('cap', () => admApi('/api/settings', 'POST', {provider_capacity: caps}), r => r);
  }catch(e){ admMsg('❌ ' + e.message, 'bad'); } };
  ts.append(sc);
  const lf = ce('div', 'frow'); lf.style.marginTop = '12px'; lf.append(ce('label', '', 'Limite/dia'));
  const li = ce('input', 'in'); li.value = tok.daily_limit || 0; li.inputMode = 'numeric'; lf.append(li);
  const lb = ce('button', 'btn alt', 'Guardar'); lb.onclick = () => { try{
    const v = parseTok(li.value); admAct('limit', () => admApi('/api/settings', 'POST', {daily_token_limit: v}), r => r);
  }catch(e){ admMsg('❌ ' + e.message, 'bad'); } };
  const l75 = ce('button', 'btn alt', '75 % da capacidade'); l75.onclick = () => { if(cap.total_capacity) li.value = Math.floor(cap.total_capacity * 0.75); };
  lf.append(lb, l75); ts.append(lf);
  ts.append(ce('div', 'muted', 'Limite/dia pára o modo autónomo quando o total gasto o atinge. Capacidade é uma estimativa dos limites grátis de cada fornecedor.'));
  body.append(ts);

  // categorias
  const cs = ce('div', 'sec');
  const ch = ce('div', 'lrow'); ch.append(ce('h3', '', '📊 Comparação por categoria'), mkBench()); cs.append(ch);
  cs.append(ce('div', 'muted', 'Toca numa linha para escolher a categoria.'));
  const tw = ce('div', 'tw'), tb = ce('table', 't');
  const head = ce('tr'); ['Categoria', 'gois.v1', 'Gemini', 'DeepSeek', 'Lições', 'Bench.'].forEach(h => head.append(ce('th', '', h)));
  const th = ce('thead'); th.append(head); tb.append(th);
  const tbd = ce('tbody');
  names.forEach(n => {
    const e = cats[n] || {}, tr = ce('tr', n === admSel ? 'sel' : '');
    [n, fmtP(e.gois_score), fmtP(e.gemini_ref), fmtP(e.deepseek_ref), e.lessons || 0, e.benchmarks || 0].forEach(v => tr.append(ce('td', '', String(v))));
    tr.onclick = () => { admSel = n; [...tbd.children].forEach(c => c.classList.remove('sel')); tr.classList.add('sel'); $('admSelLbl').textContent = 'Selecionada: ' + n; };
    tbd.append(tr);
  });
  tb.append(tbd); tw.append(tb); cs.append(tw);
  const sl = ce('div', 'muted', 'Selecionada: ' + admSel); sl.id = 'admSelLbl'; sl.style.margin = '8px 0'; cs.append(sl);
  const fr2 = ce('div', 'frow');
  const bs = ce('button', 'btn', '📚 Estudar'); bs.onclick = () => admRunLearn();
  const bb = ce('button', 'btn alt', '⚔️ Benchmark'); bb.onclick = () => admRunBench();
  fr2.append(bs, bb); cs.append(fr2);
  cs.append(ce('div', 'muted', 'O benchmark demora 30–90 s e gasta tokens.'));
  body.append(cs);

  const msg = ce('div', 'muted'); msg.id = 'admMsg'; body.append(msg);
  admRenderLocal();
  updateLamps();
}
function admRenderLocal(){
  const e = $('admLocal'); if(!e || !admLocal) return;
  e.textContent = 'Modelo próprio: ' + (admLocal.online ? '🟢 online (' + admLocal.model + ')' : admLocal.url_set ? '🔴 offline' + (admLocal.error ? ' (' + admLocal.error + ')' : '') : '⚪ sem URL configurado');
}

async function admAct(tag, work, pick){
  if(admBusy){ admMsg('⏳ Já há uma operação em curso…', 'warnc'); return; }
  admBusy = true; admMsg('⏳ A guardar…', 'muted');
  try{ const r = await work(); admData = pick(r); admRender(); admMsg('✅ Guardado.', 'ok'); }
  catch(e){ admMsg('❌ ' + e.message, 'bad'); }
  admBusy = false;
}
async function admRunLearn(){
  if(admBusy){ admMsg('⏳ Já há uma operação em curso…', 'warnc'); return; }
  const cat = admSel; admBusy = true; admMsg('📚 A estudar «' + cat + '»…', 'muted');
  localJob = {kind: 'learn', category: cat}; updateLamps();
  try{
    const r = await admApi('/api/classroom/learn', 'POST', {category: cat});
    admData = r.settings; admRender(); admMsg('✅ Nova lição: ' + ((r.lesson && r.lesson.title) || cat), 'ok');
  }catch(e){ admMsg('❌ ' + e.message, 'bad'); }
  admBusy = false; localJob = null; updateLamps(); pollJob();
}
async function admRunBench(){
  if(admBusy){ admMsg('⏳ Já há uma operação em curso…', 'warnc'); return; }
  const cat = admSel; admBusy = true; admMsg('⚔️ Benchmark em «' + cat + '» (30–90 s)…', 'muted');
  localJob = {kind: 'benchmark', category: cat}; updateLamps();
  try{
    const r = await admApi('/api/comparison/benchmark', 'POST', {category: cat});
    const b = r.benchmark || {};
    admData = r.settings; admRender();
    admMsg('✅ gois.v1 ' + fmtP(b.gois_score) + ' · Gemini ' + fmtP(b.gemini_ref) + ' · DeepSeek ' + fmtP(b.deepseek_ref), 'ok');
  }catch(e){ admMsg('❌ ' + e.message, 'bad'); }
  admBusy = false; localJob = null; updateLamps(); pollJob();
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeAdmin(); });

// ----- indicadores animados (modo admin) -----
let modelState = 'checking', jobState = {}, learningNow = false, localJob = null, _pm = false, _pj = false;
function mkLamp(id){
  const w = ce('span', 'lamp'); w.id = id; w.append(ce('i', 'dot'), ce('span', 'lt')); return w;
}
function mkBench(){
  const w = ce('span', 'lamp'); w.id = 'benchLamp'; w.append(ce('span', 'badge', '0'), ce('span', 'lt', 'Nenhum benchmark a correr')); return w;
}
function setLamp(id, mode, color, text, pre){
  const el = $(id); if(!el) return;
  const ind = el.firstElementChild;
  ind.className = mode === 'spin' ? 'spinr' : 'dot' + (mode === 'pulse' ? ' pulse' : mode === 'slow' ? ' slow' : '');
  ind.style.setProperty('--c', color);
  const p = el.querySelector('.pre'); if(p) p.textContent = pre || '';
  el.querySelector('.lt').textContent = text;
}
function updateLamps(){
  const G = '#3fb950', W = '#d29922', R = '#f85149', M = '#8b949e';
  const m = modelState;
  const ml = $('modelLamp');
  if(ml){
    const S = {online: ['pulse', G, 'online', 'Modelo '], checking: ['pulse', W, 'a verificar…', 'Modelo '],
               offline: ['off', R, 'offline', 'Modelo '], nolink: ['off', W, 'não ligado', 'Modelo '],
               noserver: ['off', R, 'servidor sem resposta', '']}[m] || ['off', M, 'sem sessão admin', ''];
    setLamp('modelLamp', S[0], S[1], S[2], S[3]);
    ml.title = m === 'online' ? 'Modelo online e funcional' : 'Modelo: ' + S[2];
  }
  const job = localJob || jobState || {};
  const auto = (admData && admData.learning_now != null) ? !!admData.learning_now : learningNow;
  if($('studyLamp')){
    if(job.kind === 'learn') setLamp('studyLamp', 'spin', G, 'A estudar · ' + (job.category || ''));
    else if(auto) setLamp('studyLamp', 'slow', W, 'Autónomo ON · à espera da próxima lição');
    else setLamp('studyLamp', 'off', M, 'Em repouso · não está a estudar');
  }
  const bl = $('benchLamp');
  if(bl){
    const on = job.kind === 'benchmark';
    const b = bl.querySelector('.badge'); b.textContent = on ? '1' : '0'; b.className = 'badge' + (on ? ' on' : '');
    bl.querySelector('.lt').textContent = on ? 'A executar benchmark · ' + (job.category || '') : 'Nenhum benchmark a correr';
  }
}
async function pollModel(){
  if(!isAdmin || document.hidden || _pm) return; _pm = true;
  try{
    const r = await fetch(API + '/api/local/status', {headers: hdrs()});
    if(!r.ok) throw new Error('http');
    const j = await r.json();
    modelState = j.online ? 'online' : (j.url_set ? 'offline' : 'nolink');
  }catch(e){ modelState = 'noserver'; }
  _pm = false; updateLamps();
}
async function pollJob(){
  if(!isAdmin || document.hidden || _pj) return; _pj = true;
  try{
    const r = await fetch(API + '/api/job', {headers: hdrs()});
    if(r.ok){ const j = await r.json(); jobState = j.job || {}; learningNow = !!j.learning_now; }
  }catch(e){}
  _pj = false; updateLamps();
}
function startLamps(){
  if(!isAdmin) return;
  updateLamps(); pollModel(); pollJob();
  setInterval(pollJob, 8000); setInterval(pollModel, 20000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden){ pollJob(); pollModel(); } });
}

(async function(){
  await initAdmin(); load(); startLamps();
  if(!chats.length) newChat(); else { if(!chat()) cur = chats[0].id; renderHistory(); renderChat(); }
})();
</script>
